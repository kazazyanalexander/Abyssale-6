# ====================================================
# INTRODUCTION
# ====================================================

intro_title = Abyssal-6 - Introduction
start_game = START MISSION
quit_game = Quit

introduction = SYSTEM LOG: ABYSSAL-6 RESEARCH STATION\n\
    DATE: 31.12.2074 DEPTH: 1,000 METERS\n\
    You wake up to the screaming, rhythmic sound of a\n\
    proximity alarm. The air is saturated with\n\
    the smell of ozone and burnt metal.\n\
    Your memories are hazy... A structural tremor?\n\
    An explosion? The computer's voice\n\
    is cold and distorted: \n\
    'CRITICAL FAILURE IN SECTOR 4.\n\
    HULL INTEGRITY AT 14%.\n\
    REACTOR OVERHEAT DETECTED.\n\
    ESTIMATION BEFORE EXPLOSION: 10 MINUTES.'\n\
    You are currently in the Entry SAS.\n\
    Through the reinforced quartz glass, the abyss\n\
    stares back at you—total, crushing darkness, home to\n\
    creatures that have never seen the sun.\n\
    You have no crew. No radio contact.\n\
    Just your suit and the sound of your own\n\
    panicked breathing. Find the Reactor.\n\
    Repair the core.\n\
    Or join the cemetery at the bottom of the world.\n\n\
    MISSION: REPAIR THE REACTOR BEFORE FINAL EXPLOSION.

