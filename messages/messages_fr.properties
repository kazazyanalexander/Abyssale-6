# ====================================================
# INTRODUCTION
# ====================================================

intro_title = Abyssal-6 - Introduction
start_game = COMMENCER MISSION
quit_game = Quitter

introduction = JOURNAL SYSTÈME: STATION DE RECHERCHE ABYSSAL-6\n\
    DATE: 31.12.2074 PROFONDEUR: 1,000 MÈTRES\n\
    Vous vous réveillez au son hurlant et rythmé d'une\n\
    alarme de proximité. L'air est saturé par\n\
    l'odeur d'ozone et de métal brûlé.\n\
    Vos souvenirs sont flous... Un tremblement structurel?\n\
    Une explosion? La voix de l'ordinateur\n\
    est froide et distordue: \n\
    'DÉFAILLANCE CRITIQUE DANS LE SECTEUR 4.\n\
    INTÉGRITÉ DE LA COQUE À 14%.\n\
    SURCHAUFFE DU RÉACTEUR DÉTECTÉE.\n\
    ESTIMATION AVANT EXPLOSION: 10 MINUTES.'\n\
    Vous êtes actuellement dans le SAS d'entrée.\n\
    À travers le verre de quartz renforcé, les abysses\n\
    vous fixent—une obscurité totale et écrasante, foyer de\n\
    créatures n'ayant jamais vu le soleil.\n\
    Vous n'avez pas d'équipage. Aucun contact radio.\n\
    Juste votre combinaison et le son de votre propre\n\
    respiration paniquée. Trouvez le Réacteur.\n\
    Réparer le noyau.\n\
    Ou rejoignez le cimetière au fond du monde.\n\n\
    MISSION: RÉPARER LE RÉACTEUR AVANT L'EXPLOSION FINALE.
    
