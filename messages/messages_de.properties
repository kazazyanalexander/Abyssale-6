# ====================================================
# EINFÜHRUNG
# ====================================================

intro_title = Abyssal-6 - Einführung
start_game = MISSION STARTEN
quit_game = Beenden

introduction = SYSTEMPROTOKOLL: ABYSSAL-6 FORSCHUNGSSTATION\n\
    DATUM: 31.12.2074 TIEFE: 1.000 METER\n\
    Sie wachen auf beim schrillen, rhythmischen Klang eines\n\
    Näherungsalarms. Die Luft ist gesättigt mit\n\
    dem Geruch von Ozon und verbranntem Metall.\n\
    Ihre Erinnerungen sind verschwommen... Ein strukturelles Beben?\n\
    Eine Explosion? Die Stimme des Computers\n\
    ist kalt und verzerrt: \n\
    'KRITISCHER AUSFALL IN SEKTOR 4.\n\
    HÜLLENINTEGRITÄT BEI 14%.\n\
    REAKTORÜBERHITZUNG ERKANNT.\n\
    SCHÄTZUNG VOR EXPLOSION: 10 MINUTEN.'\n\
    Sie befinden sich derzeit in der Eingangsschleuse.\n\
    Durch das verstärkte Quarzglas starrt der Abgrund\n\
    zurück—totale, erdrückende Dunkelheit, Heimat von\n\
    Kreaturen, die nie die Sonne gesehen haben.\n\
    Sie haben keine Crew. Keinen Funkkontakt.\n\
    Nur Ihren Anzug und den Klang Ihrer eigenen\n\
    panischen Atmung. Finden Sie den Reaktor.\n\
    Reparieren Sie den Kern.\n\
    Oder schließen Sie sich dem Friedhof am Grund der Welt an.\n\n\
    MISSION: REPARIEREN SIE DEN REAKTOR VOR DER FINALEN EXPLOSION.

